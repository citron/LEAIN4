name: CI

on:
  push:
  pull_request:

jobs:
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          build-args: LeanDL ch01 ch02 ch03 ch04 ch05 mnist cnn rnn lstm gru gpt minigpt mhead vae gan diffusion rl bellman worldmodel jepa ch16 ch17 ch18 ch19 capstone figures
      - name: "Audit axioms (expects: using sorry #[])"
        run: lake env lean ../scripts/audit_axioms.lean
        working-directory: lean
      - name: Download MNIST (used by capstone smoke and the regression step)
        run: ./scripts/get-mnist.sh
      - name: Smoke-run representative demos (one per area; MNIST-heavy ones live in dedicated steps)
        run: |
          set -e
          for exe in ch01 ch02 ch03 ch04 ch05 ch16 ch17 ch18 ch19 capstone gru mhead gan rl bellman minigpt; do
            echo "== lake exe $exe =="
            lake exe "$exe"
          done
        working-directory: lean
        timeout-minutes: 20
      - name: "JEPA demo (long-running: thousands of EMA steps, kept out of the fast loop)"
        run: lake exe jepa
        working-directory: lean
        timeout-minutes: 30

      - name: Property tests (theorems exercised on seeded pseudorandom inputs)
        run: lake exe props
        working-directory: lean
        timeout-minutes: 10
      - name: MNIST integration test (seeded SGD, accuracy must reach 90%)
        run: |
          ../scripts/get-mnist.sh
          out=$(lake exe mnist 10000 5000 3 | tail -1)
          echo "$out"
          acc=$(echo "$out" | sed 's/.*= //')
          awk -v a="$acc" 'BEGIN { exit !(a >= 0.90) }' || { echo "MNIST regression: $acc < 0.90"; exit 1; }
        working-directory: lean
        timeout-minutes: 10

  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: node scripts/check.mjs
      - run: npm ci
        working-directory: website
      - run: npm run build
        working-directory: website
