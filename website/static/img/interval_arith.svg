<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 250" font-family="sans-serif" font-size="12"><rect width="480" height="250" fill="white"/>
<text x="56" y="16" font-weight="bold">Certified intervals: each operation carries its enclosure</text>
<text x="50" y="52" text-anchor="end">X</text>
<line x1="60" y1="48" x2="460" y2="48" stroke="#ccc"/>
<rect x="185" y="40" width="50" height="16" fill="#2e5aa8" fill-opacity="0.55" stroke="#2e5aa8"/>
<text x="185" y="70" text-anchor="middle">1</text><text x="235" y="70" text-anchor="middle">3</text>
<text x="50" y="102" text-anchor="end">Y</text>
<line x1="60" y1="98" x2="460" y2="98" stroke="#ccc"/>
<rect x="210" y="90" width="50" height="16" fill="#c4561a" fill-opacity="0.55" stroke="#c4561a"/>
<text x="210" y="120" text-anchor="middle">2</text><text x="260" y="120" text-anchor="middle">4</text>
<text x="50" y="152" text-anchor="end">X + Y</text>
<line x1="60" y1="148" x2="460" y2="148" stroke="#ccc"/>
<rect x="235" y="140" width="100" height="16" fill="#2a9d5c" fill-opacity="0.55" stroke="#2a9d5c"/>
<text x="235" y="170" text-anchor="middle">3</text><text x="335" y="170" text-anchor="middle">7</text>
<text x="50" y="202" text-anchor="end">X * Y</text>
<line x1="60" y1="198" x2="460" y2="198" stroke="#ccc"/>
<rect x="210" y="190" width="250" height="16" fill="#8a4fb3" fill-opacity="0.55" stroke="#8a4fb3"/>
<text x="210" y="220" text-anchor="middle">2</text><text x="460" y="220" text-anchor="middle">12</text>
<text x="60" y="244" fill="#555">add: the bounds add (add_spec). mul: the four corners bound the product (mul_spec) - an inclusion, never an equality.</text>
</svg>
