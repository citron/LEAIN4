<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" font-family="sans-serif" font-size="12"><rect width="480" height="300" fill="white"/>
<text x="40" y="16" font-weight="bold">Multiplying X * Y: the four corners bound every product</text>
<rect x="180" y="70" width="210" height="200" fill="none" stroke="#555" stroke-dasharray="4 3"/>
<circle cx="180" cy="70" r="4" fill="#8a4fb3"/><text x="188" y="62">a*d = -3</text>
<circle cx="390" cy="70" r="4" fill="#8a4fb3"/><text x="382" y="62" text-anchor="end">b*d = 6  (max)</text>
<circle cx="180" cy="270" r="4" fill="#8a4fb3"/><text x="188" y="262">a*c = 2</text>
<circle cx="390" cy="270" r="4" fill="#8a4fb3"/><text x="382" y="262" text-anchor="end">b*c = -4  (min)</text>
<text x="160" y="90" text-anchor="end" fill="#555">x = -1</text>
<text x="410" y="90" fill="#555">x = 2</text>
<text x="410" y="255" fill="#555">y = -2</text>
<text x="410" y="85" fill="#555">y = 3</text>
<circle cx="315" cy="190" r="5" fill="#2a9d5c"/><text x="325" y="194" fill="#2a9d5c">x = 0.5, y = 1: xy = 0.5, inside [-4, 6]</text>
<text x="40" y="292" fill="#555">box_max / box_min (proved by sign case-splits): xy in [min of the corners, max of the corners].</text>
</svg>
